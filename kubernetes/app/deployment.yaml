apiVersion: apps/v1
kind: Deployment
metadata:
  name: timesheet-dep
  namespace: timesheet

spec:
  replicas: 1

  selector:
    matchLabels:
      app: timesheet

  template:
    metadata:
      labels:
        app: timesheet
    spec:
      containers:
        - name: timesheet
          image: timesheet:bootstrap
          imagePullPolicy: Never

          ports:
            - containerPort: 8082

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-serv:3306/timesheet-devops-db?useUnicode=true&serverTimezone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timesheet-db
                  key: password
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: health,prometheus
          readinessProbe:
            httpGet: {path: /timesheet-devops/actuator/health, port: 8082}
            initialDelaySeconds: 45
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /timesheet-devops/actuator/health, port: 8082}
            initialDelaySeconds: 60
            periodSeconds: 10
