# Provisioning automatique de Prometheus comme source de données Grafana
# Grafana détecte ce fichier au démarrage — aucune configuration manuelle requise
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
