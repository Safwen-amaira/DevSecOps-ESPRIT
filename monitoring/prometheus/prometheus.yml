global:
  scrape_interval: 15s          # Collecte toutes les 15 secondes
  evaluation_interval: 15s      # Évalue les règles d'alerte toutes les 15s

scrape_configs:

  # Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Application Timesheet (Spring Boot sur Docker Compose)
  - job_name: 'timesheet-app'
    metrics_path: /timesheet-devops/actuator/prometheus
    static_configs:
      - targets: ['timesheet-app:8082']

  - job_name: 'jenkins-pipeline'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: 'timesheet-kubernetes'
    metrics_path: /timesheet-devops/actuator/prometheus
    static_configs:
      - targets: ['k3s:30082']
