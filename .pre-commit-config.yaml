# ============================================================
# DevSecOps Pre-Commit Hooks Configuration
# ============================================================
# Runs BEFORE every git commit to enforce security locally.
# Implements "Shift-Left Security" as per project requirements.
#
# To install: pre-commit install
# To run manually: pre-commit run --all-files
# ============================================================

repos:

  # ---- 1. BASIC FILE HYGIENE --------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: "[Hygiene] Remove trailing whitespace"
      - id: end-of-file-fixer
        name: "[Hygiene] Fix end of file"
      - id: check-yaml
        name: "[Hygiene] Validate YAML syntax"
      - id: check-xml
        name: "[Hygiene] Validate XML syntax"
      - id: check-json
        name: "[Hygiene] Validate JSON syntax"
      - id: check-merge-conflict
        name: "[Hygiene] Detect unresolved merge conflicts"
      - id: check-added-large-files
        name: "[Hygiene] Block large file commits (>1MB)"
        args: ['--maxkb=1024']
        exclude: '^screenshots/'
      - id: detect-private-key
        name: "[SECURITY] Detect private keys in staged files"
      - id: check-executables-have-shebangs
        name: "[Hygiene] Scripts must have shebangs"
      - id: mixed-line-ending
        name: "[Hygiene] Normalize line endings"

  # ---- 2. SECRET DETECTION (Gitleaks) ----------------------
  # Blocks commits containing API keys, tokens, passwords, etc.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: "[SECURITY] Gitleaks — Scan for exposed secrets"

  # ---- 3. SECRET DETECTION (HMRC Hooks - secondary layer) --
  - repo: https://github.com/hmrc/security-git-hooks
    rev: release/1.15.0
    hooks:
      - id: secrets_filecontent
        name: "[SECURITY] HMRC — Scan file content for secrets"
        exclude: "\\.(tar|gz|jar|7z|rar|bz2|zip|gzip|war|ear|xlsx|xls|docx|doc|pptx|pdf|jpg|png|jpeg|tif|tiff|gif|bmp|webp|svg|ico|psd|exe|dll|dmg|rpm)$"
      - id: secrets_filename
        name: "[SECURITY] HMRC — Block sensitive file names"
        exclude: "\\.(tar|gz|jar|7z|rar|bz2|zip|gzip|war|ear|xlsx|xls|docx|doc|pptx|pdf|jpg|png|jpeg|tif|tiff|gif|bmp|webp|svg|ico|psd|exe|dll|dmg|rpm)$"

  # ---- 4. SAST — Semgrep Static Analysis -------------------
  # Detects: SQL injection, XSS, hardcoded secrets, OWASP Top 10
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.100.0
    hooks:
      - id: semgrep
        name: "[SAST] Semgrep — Java security rules"
        args:
          - --config=p/java
          - --config=p/owasp-top-ten
          - --config=p/secrets
          - --error
          - --severity=ERROR
        types: [java]

  # ---- 5. DOCKER SECURITY ----------------------------------
  # Basic Dockerfile best-practice checks
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.0-beta
    hooks:
      - id: hadolint-docker
        name: "[SECURITY] Hadolint — Dockerfile security lint"
        args: [
          "--failure-threshold", "error",
          "--ignore", "DL3008",   # Allow apt without version pinning (CI only)
          "--ignore", "DL3009"
        ]

  # ---- 6. YAML / KUBERNETES SECURITY ----------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: "[Quality] YAML lint"
        args: [-d, relaxed]

  # ---- 7. CUSTOM JAVA SAST -----------------------------------
  # Runs project-specific Java security rules before commit
  - repo: local
    hooks:
      - id: semgrep-custom-security
        name: "[SAST] Semgrep — project security rules"
        entry: semgrep --config=security/semgrep-rules.yml --error
        language: system
        types: [java]
