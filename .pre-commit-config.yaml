# ============================================================
# DevSecOps Pre-Commit Hooks Configuration
# ============================================================
# Runs BEFORE every git commit to enforce security locally.
# Implements "Shift-Left Security" as per project requirements.
#
# To install: pre-commit install
# To run manually: pre-commit run --all-files
# ============================================================


repos:

  # ---- 1. BASIC FILE HYGIENE --------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: "[Hygiene] Remove trailing whitespace"
      - id: end-of-file-fixer
        name: "[Hygiene] Fix end of file"
      - id: check-yaml
        name: "[Hygiene] Validate YAML syntax"
        args: ['--allow-multiple-documents']
      - id: check-xml
        name: "[Hygiene] Validate XML syntax"
      - id: check-json
        name: "[Hygiene] Validate JSON syntax"
      - id: check-merge-conflict
        name: "[Hygiene] Detect unresolved merge conflicts"
      - id: check-added-large-files
        name: "[Hygiene] Block large file commits (>1MB)"
        args: ['--maxkb=1024']
        exclude: '^screenshots/'
      - id: detect-private-key
        name: "[SECURITY] Detect private keys in staged files"
      - id: check-executables-have-shebangs
        name: "[Hygiene] Scripts must have shebangs"
      - id: mixed-line-ending
        name: "[Hygiene] Normalize line endings"

  # ---- 2. SECRET DETECTION (Gitleaks) ----------------------
  # Blocks commits containing API keys, tokens, passwords, etc.
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: "[SECURITY] Gitleaks — Scan staged files for secrets"
        entry: scripts/precommit-gitleaks.sh
        language: system
        pass_filenames: false

  # ---- 3. CUSTOM JAVA SAST -----------------------------------
  # Uses local rules only; no registry download is needed at commit time.
  - repo: local
    hooks:
      - id: semgrep-java-security
        name: "[SAST] Semgrep — project Java security rules"
        entry: scripts/precommit-semgrep.sh
        language: system
        types: [java]
      - id: trivy-iac-security
        name: "[IaC] Trivy — block critical infrastructure findings"
        entry: scripts/precommit-trivy-iac.sh
        language: system
        files: '(^docker-compose\.yml$|^kubernetes/|^Dockerfile$)'
        pass_filenames: false
      - id: trivy-dependency-security
        name: "[SCA] Trivy — block critical dependency findings"
        entry: scripts/precommit-trivy-sca.sh
        language: system
        files: '^pom\.xml$'
        pass_filenames: false
