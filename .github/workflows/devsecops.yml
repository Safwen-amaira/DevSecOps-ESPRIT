name: DevSecOps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Tests and security gates
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: timesheet-devops-db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests and package application
        id: tests
        run: mvn --batch-mode --no-transfer-progress package

      - name: Scan Git history for secrets (Gitleaks)
        if: always()
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

      - name: Run custom SAST rules (Semgrep)
        if: always()
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/target/devsecops-reports:/reports" \
            semgrep/semgrep:1.100.0 semgrep scan \
            --config /src/security/semgrep-rules.yml --severity ERROR --error \
            --json --output /reports/semgrep.json /src

      - name: Scan dependencies (Trivy SCA)
        if: always()
        run: |
          mkdir -p target/devsecops-reports "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v "$PWD:/work" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" -w /work aquasec/trivy:0.76.2 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output target/devsecops-reports/trivy-sca.json target/timesheet-devops-1.0.jar
          docker run --rm -v "$PWD:/work" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" -w /work aquasec/trivy:0.76.2 \
            fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 target/timesheet-devops-1.0.jar

      - name: Scan infrastructure configuration (Trivy IaC)
        if: always()
        run: |
          docker run --rm -v "$PWD:/work" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" -w /work aquasec/trivy:0.76.2 \
            config --severity HIGH,CRITICAL --format json \
            --output target/devsecops-reports/trivy-iac.json .
          docker run --rm -v "$PWD:/work" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" -w /work aquasec/trivy:0.76.2 \
            config --severity CRITICAL --exit-code 1 .

      - name: Build container image
        id: container
        if: always()
        run: docker build --tag timesheet:${{ github.sha }} .

      - name: Scan container image (Trivy)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/target/devsecops-reports:/reports" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" aquasec/trivy:0.76.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output /reports/trivy-image.json timesheet:${{ github.sha }}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" aquasec/trivy:0.76.2 image --severity CRITICAL --ignore-unfixed \
            --exit-code 1 timesheet:${{ github.sha }}

      - name: Run application for DAST
        if: always() && steps.tests.outcome == 'success' && steps.container.outcome == 'success'
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/timesheet-devops-db?serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ci-only-password
          LOGGING_FILE_NAME: /tmp/timesheet-devops.log
        run: |
          docker rm -f timesheet-dast >/dev/null 2>&1 || true
          docker run --detach --network host --name timesheet-dast \
            --env SPRING_DATASOURCE_URL \
            --env SPRING_DATASOURCE_USERNAME \
            --env SPRING_DATASOURCE_PASSWORD \
            --env LOGGING_FILE_NAME \
            timesheet:${{ github.sha }}
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8082/timesheet-devops/user/retrieve-all-users; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' timesheet-dast 2>/dev/null || true)" != "true" ]; then
              docker logs timesheet-dast || true
              exit 1
            fi
            sleep 2
          done
          docker logs timesheet-dast || true
          exit 1

      - name: Run OWASP ZAP baseline DAST
        if: always() && steps.tests.outcome == 'success' && steps.container.outcome == 'success'
        run: |
          docker run --rm --network host -v "$PWD/target/devsecops-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:8082/timesheet-devops/user/retrieve-all-users \
            -r zap-report.html -J zap-report.json -I

      - name: Stop DAST application
        if: always()
        run: docker rm -f timesheet-dast >/dev/null 2>&1 || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: devsecops-reports-${{ github.run_id }}
          path: target/devsecops-reports/
          if-no-files-found: warn
          retention-days: 30



  trigger-jenkins:
    name: Start Jenkins pipeline
    needs: [security]
    # Self-hosted runner: only on pushes to master, never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, jenkins-local]
    steps:
      - name: Trigger Jenkins job
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          curl --fail --silent --show-error -X POST \
            --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
            "http://jenkins:8080/job/DevSecOps-ESPRIT/buildWithParameters" \
            --data-urlencode "COMMIT=${{ github.sha }}"
